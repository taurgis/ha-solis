name: Minimum Home Assistant

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  minimum-ha:
    name: Boot minimum Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Load the integration on the minimum Home Assistant version
        run: python scripts/check_minimum_home_assistant.py
