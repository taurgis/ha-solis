name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Lint
        run: python -m ruff check custom_components tests tools scripts

      - name: Format
        run: python -m ruff format --check custom_components tests tools scripts

      - name: Type check
        run: python -m mypy --strict custom_components/solis

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=custom_components/solis --cov-report=term-missing --cov-fail-under=90
