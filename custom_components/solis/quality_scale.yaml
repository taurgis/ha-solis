rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No actions or services are registered. SolisCloud control writes are intentionally not exposed.
  appropriate-polling:
    status: done
    comment: >-
      The coordinator polls every 300 seconds by default (minimum 60).
      SolisCloud publishes a sample about every five minutes, and each path
      is held to one call every two seconds.
  brands:
    status: done
    comment: >-
      custom_components/solis/brand ships icon.png at 256x256 and
      icon@2x.png at 512x512. Home Assistant loads that folder for a custom
      integration. The artwork is original and is not the Solis logo.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: >-
      config_flow.py is at 100%, and CI fails below that.
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No actions or services are registered.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: The integration does not fire custom events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No actions or services are registered.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      The first poll of an auth, clock, timeout or cloud failure is logged
      at warning. Repeats of the same failure are debug until a poll succeeds.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: CI fails below 95% (--cov-fail-under=95).

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: SolisCloud accounts are not discoverable on the local network.
  discovery:
    status: exempt
    comment: SolisCloud accounts are not discoverable on the local network. A future local transport could add Modbus discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      Measurement time, battery state of health, force-charge and
      overdischarge SOC, string power and logger RSSI are disabled by
      default.
  entity-translations: done
  exception-translations:
    status: exempt
    comment: Failures are reported with config-flow error keys and repair issues. The integration does not raise HomeAssistantError.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
