rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No actions or services are registered. SolisCloud control writes are intentionally not exposed.
  appropriate-polling:
    status: done
    comment: >-
      Cloud polls every 300 seconds by default and never faster than 60.
      A local logger defaults to 60 seconds and cannot be faster than 30.
      Register reads on one connection are at least one second apart.
      A reset waits at least 10 seconds, then longer, up to about 10 minutes,
      and tries once per pause. CoordinatorEntity does not poll on its own.
  brands:
    status: done
    comment: >-
      icon.png and logo.png are the files already published at
      home-assistant/brands custom_integrations/solis, copied here unchanged.
      No @2x files ship: there are no high-DPI originals, and the brands
      guidelines reject upscaled images. Home Assistant 2026.3+ loads
      custom_components/solis/brand/ locally. Older cores use the brands CDN,
      which serves the same icon and logo. core_integrations/solis does not
      exist; this domain is a custom integration.
  common-modules:
    status: done
    comment: >-
      The coordinator is coordinator.py. Shared DeviceInfo and the entity
      base are entity.py.
  config-flow:
    status: done
    comment: >-
      The user step is a menu (SolisCloud only, local stick, local stick
      with SolisCloud backup). Then the SolisCloud form and plant selection,
      and the logger form with a collapsed Advanced section. A web password
      step and a stick-or-gateway choice appear only when needed. DHCP
      discovery, reauth (API key or stick web password) and a reconfigure
      menu are separate steps. Field context is in data_description.
      Credentials and plant ids live in entry data. Polling, the timezone
      and the request limits live in options (OptionsFlowWithReload).
  config-flow-test-coverage:
    status: done
    comment: >-
      config_flow.py is at 100%, and CI fails below that, separately from
      the per-module 95% floor.
  dependency-transparency:
    status: exempt
    comment: >-
      manifest.json requirements is empty. The SolisCloud client is part of
      this integration, not a PyPI package.
  docs-actions:
    status: exempt
    comment: No actions or services are registered.
  docs-conditions:
    status: exempt
    comment: The integration provides no condition platform.
  docs-high-level-description:
    status: done
    comment: >-
      README and docs/index.md describe SolisCloud and local stick access,
      read-only behaviour, the Energy dashboard sensors, a connection
      decision table by stick model, and the relationship to
      hultenvp/solis-sensor.
  docs-installation-instructions:
    status: done
    comment: >-
      README and docs/installation.md cover the API key and local stick
      prerequisites, HACS, manual install, and the minimum Home Assistant
      version.
  docs-removal-instructions:
    status: done
    comment: >-
      README and docs/removal.md cover deleting the config entry, what is
      removed with it, uninstalling the component, and the API key staying
      valid on SolisCloud.
  docs-triggers:
    status: exempt
    comment: The integration provides no trigger platform.
  entity-event-setup:
    status: exempt
    comment: >-
      Entities do not subscribe to Home Assistant events. CoordinatorEntity
      attaches to the coordinator in async_added_to_hass, and the platform
      listeners are removed with async_on_unload.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: >-
      A SolisCloud-only entry is keyed by the API key id, and a key already
      used by another entry aborts unless both are local entries with
      SolisCloud backup (each has its own stick). An entry with a stick is
      keyed by the stick (Solarman serial, s2:, tcp: or rtu: id). Reconfigure
      aborts when the new stick id belongs to another entry.

  # Silver
  action-exceptions:
    status: exempt
    comment: No actions or services are registered.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: >-
      docs/configuration.md lists every options-flow field, including the
      plant timezone choices and the Advanced section, with the default and
      the allowed range.
  docs-installation-parameters:
    status: done
    comment: >-
      docs/configuration.md and docs/installation.md describe the first-step
      menu, the SolisCloud form and plant selection, the local stick form
      and its Advanced section, and the web password step.
  entity-unavailable:
    status: done
    comment: >-
      Instant sensors are unavailable when the sample is stale or that
      inverter could not be read. A sustained cloud outage hides live
      readings the same way. Energy totals stay at the last good value.
      With no snapshot yet, the update fails and entities are not created.
  integration-owner:
    status: done
    comment: manifest.json codeowners is @taurgis.
  log-when-unavailable:
    status: done
    comment: >-
      A sustained cloud outage logs one warning when live readings are
      hidden, and one info line when the cloud returns. A local fault logs
      one info line, and one warning when its repair opens after 10 minutes.
      Polls in between are not logged.
      UpdateFailed is used when there is no snapshot to hold, and
      DataUpdateCoordinator logs that first failure and the recovery once.
  parallel-updates:
    status: done
    comment: >-
      sensor.py and binary_sensor.py set PARALLEL_UPDATES = 0. Every value
      comes from the shared coordinator.
  reauthentication-flow:
    status: done
    comment: >-
      A rejected API key raises ConfigEntryAuthFailed (or starts reauth from
      a local entry whose SolisCloud backup was rejected). reauth_confirm
      replaces the key and refuses a key from another account. A web-page
      stick that rejects its password starts reauth_web for the stick
      password; an entry with both asks which login failed.
  test-coverage:
    status: done
    comment: >-
      CI fails unless every module under custom_components/solis is above
      95 percent. config_flow.py is held to 100 percent separately.

  # Gold
  devices:
    status: done
    comment: >-
      Plants, inverters, data loggers, and export meters are devices.
      Inverters carry manufacturer, model, serial number, and HMI firmware.
      A local logger device carries the stick MAC as a network connection.
      A local-only entry has no placeholder plant device (older shared ones
      are detached on setup). Logger and EPM names are translated.
      Subdevices link to the plant with via_device_id on Home Assistant
      2026.8 and newer, and with via_device on 2025.10.
  diagnostics:
    status: done
    comment: >-
      Entry and device diagnostics run through async_redact_data: API key id
      and secret, stick password, host, MAC, serials, plant ids, names, the
      entry title, location, device identifiers and connections, and DHCP
      discovery keys. The entry unique id is replaced too.
  discovery:
    status: done
    comment: >-
      DHCP matches the IGEN OUIs E8:FD:F8 and BC:54:F9 and registered
      devices. A new Solarman stick at a private address that answers the
      UDP 48899 probe gets its serial as unique id and a discovery_confirm
      step (local only, or local with SolisCloud backup), which continues
      into the logger form. The logger form also lists sticks found by the
      IGEN broadcast. No gateway OUI or hostname is claimed. Auto-detect
      probes TCP 502, then 8899, then a Solis web page on port 80.
  discovery-update-info:
    status: done
    comment: >-
      A Solarman logger is identified by its serial and MAC. An S2-WL-ST
      uses the stick serial, or the inverter serial read from registers
      when the stick serial was not typed. DHCP for a stored MAC writes the
      new IP into the entry and reloads it; an entry at that IP without a
      MAC gains the MAC. A web-page stick is never moved by DHCP because it
      sends a password to its host. A Solarman stick that moves is also
      found again by serial over UDP and the new IP is saved. The change is
      logged once at info.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: done
    comment: >-
      README and docs/index.md name the supported SolisCloud devices and
      state that control writes and the legacy Ginlong portal are not
      supported.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases:
    status: done
    comment: >-
      README and docs/use-cases.md describe the energy dashboard, alarm
      automations, and stale versus offline power.
  dynamic-devices:
    status: done
    comment: >-
      Sensor and binary sensor platforms listen to the coordinator and add
      entities when a new inverter, string, battery, lifetime counter,
      logger, or export meter appears.
  entity-category: done
  entity-device-class:
    status: done
    comment: >-
      Power, energy, voltage, current, frequency, temperature, battery
      (state of charge only), signal strength, timestamp and enum (status,
      data source) device classes are set. State of health and the force-charge SOC settings are
      percentages without a device class, since they are not a charge level.
  entity-disabled-by-default:
    status: done
    comment: >-
      Measurement time, battery state of health, force-charge and
      overdischarge SOC, string power, logger RSSI, and the phase sensors of
      a single-phase inverter are disabled by default.
  entity-translations: done
  exception-translations:
    status: done
    comment: >-
      UpdateFailed and ConfigEntryAuthFailed use translation_key. The
      messages are in the exceptions section of strings.json. Config-flow
      errors and repairs use their own translation keys.
  icon-translations:
    status: done
    comment: >-
      icons.json holds the icons for translation keys without a fitting
      device-class icon: status states, battery power by sign (range),
      state of health, the SOC settings, and the alarm on/off state. No
      entity sets an icon in code; the rest use their device-class icon.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      Repairs are only for conditions the user must act on outside Home
      Assistant: clock skew, an empty plant or inverter list, legacy
      control (persistent), and, after 10 minutes, a local logger that keeps
      resetting, an S2-WL-ST with port 502 closed or silent, a gateway that
      refuses connections, wrong framing, a closed S5 port, and a web page
      that is not the Solis page. None is fixable; the gateway, framing, S5
      and legacy-control repairs carry a learn_more_url to the matching
      troubleshooting section. A rejected key or stick password uses reauth
      instead, and outages and abnormal data are logged, not repairs. Poll
      repairs clear when a poll succeeds, stay across unload, and are
      deleted with the entry. Night on a stick powered by the inverter does
      not open a repair.
  stale-devices:
    status: done
    comment: >-
      A complete poll removes devices that are no longer in the snapshot.
      async_remove_config_entry_device allows the user to delete a device
      the latest snapshot does not contain. A partial poll does not delete.

  # Platinum
  async-dependency:
    status: done
    comment: >-
      The SolisCloud client uses aiohttp on the Home Assistant session. The
      local transports use asyncio streams. There is no synchronous I/O
      library.
  inject-websession:
    status: done
    comment: >-
      SolisCloudClient takes the session from async_get_clientsession, in
      setup and in the config flow. No ClientSession is created inside the
      integration. The local transports (Solarman V5, Modbus TCP and RTU,
      and the web-page stick) use asyncio streams, not aiohttp: the web
      stick client is a small hand-written HTTP/1.0 client because old stick
      firmware pads replies with NUL bytes, omits Content-Length and handles
      one socket at a time, so it has no session to inject.
  strict-typing:
    status: done
    comment: >-
      CI runs mypy --strict on custom_components/solis. py.typed marks the
      package. There is no separate library. A custom integration is not
      listed in core's .strict-typing file.
