[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
  "C90",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "ERA",
]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 25
max-returns = 10
max-statements = 90

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["homeassistant"]
known-local-folder = ["custom_components", "mock_soliscloud"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "tools"]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["aiohttp", "aiohttp.*", "voluptuous"]
ignore_missing_imports = true
